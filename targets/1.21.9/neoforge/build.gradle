plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.148' }
evaluationDependsOn(':minecraft-adapter')
apply from: rootProject.repoFile('build-logic/neoforge-loader.gradle')
apply from: rootProject.repoFile('build-logic/loader-overrides.gradle')
sourceSets {
    main { java.srcDir rootProject.repoFile('targets/1.21.1/neoforge/src/main/java'); resources.srcDir rootProject.repoFile('targets/1.21.1/neoforge/src/main/resources') }
    smoke { java.srcDir rootProject.repoFile('targets/1.21.1/neoforge/src/smoke/java') }
}
