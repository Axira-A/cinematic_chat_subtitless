plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.148' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge { version = '21.1.252' }
dependencies { api project(':client-common') }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
sourceSets { smoke { compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath; runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath } }
