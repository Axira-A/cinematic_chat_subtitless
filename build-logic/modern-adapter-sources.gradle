// Explicit compile-time API spelling bridge. Business screens and renderer remain maintained once.
// Behavioral changes (chat admission, input, audio) live in target-specific Java overrides.
tasks.named('processResources') {
    inputs.property('mixinJava',targetSpec.java)
    filesMatching('*.mixins.json') { filter { it.replace('JAVA_21','JAVA_25') } }
}
['main','smoke'].each { kind ->
    def original=rootProject.repoFile("targets/1.21.1/minecraft/src/${kind}/java")
    def replacements=file("src/${kind}/java")
    def generated=layout.buildDirectory.dir("generated/modernAdapter/${kind}")
    def generate=tasks.register("generateModern${kind.capitalize()}Adapter") {
        inputs.dir(original)
        inputs.dir(replacements)
        outputs.dir(generated)
        doLast {
            delete generated
            fileTree(original).matching { include '**/*.java' }.each { source ->
                String relative=original.toPath().relativize(source.toPath()).toString()
                if(new File(replacements,relative).isFile())return
                String code=source.getText('UTF-8')
                    .replace('GuiGraphics','GuiGraphicsExtractor')
                    .replace('net.minecraft.client.GuiMessage','net.minecraft.client.multiplayer.chat.GuiMessage')
                    .replace('.drawCenteredString(','.centeredText(')
                    .replace('.drawString(','.text(')
                if(source.name.endsWith('Screen.java'))code=code
                    .replace('void render(','void extractRenderState(')
                    .replace('void renderBackground(','void extractBackground(')
                    .replace('super.render(','super.extractRenderState(')
                if(kind=='smoke')code=code
                    .replace('mc.resizeDisplay()','mc.resizeGui()')
                    .replace('.getChat().addMessage(Component.literal("withdrawn-message"),withdrawn,null)','.getChat().addPlayerMessage(Component.literal("withdrawn-message"),withdrawn,null)')
                    .replace('.getChat().addMessage(Component.','.getChat().addClientSystemMessage(Component.')
                    .replace('.getChat().addMessage(rich,sig,null)','.getChat().addPlayerMessage(rich,sig,null)')
                def output=new File(generated.get().asFile,relative)
                output.parentFile.mkdirs();output.setText(code,'UTF-8')
            }
        }
    }
    sourceSets[kind].java.srcDir(generated)
    tasks.named(kind=='main'?'compileJava':'compileSmokeJava') { dependsOn generate }
}
