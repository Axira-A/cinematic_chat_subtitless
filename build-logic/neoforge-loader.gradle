java.toolchain.languageVersion = JavaLanguageVersion.of(targetSpec.java)
neoForge {
    version = targetSpec.neoForge
    runs {
        client { client(); gameDirectory = file('run'); systemProperty 'mixin.debug.export', 'true' }
        smoke { client(); gameDirectory = file('run-smoke'); systemProperty 'cinematic_chat.smoke', 'true'; systemProperty 'mixin.debug.export', 'true' }
    }
    mods {
        cinematic_chat {
            sourceSet sourceSets.main
            sourceSet project(':minecraft-adapter').sourceSets.main
            sourceSet project(':client-common').sourceSets.main
            sourceSet project(':engine').sourceSets.main
            sourceSet project(':minecraft-api').sourceSets.main
        }
    }
}
dependencies { implementation project(':minecraft-adapter') }
sourceSets {
    smoke {
        compileClasspath += sourceSets.main.output + configurations.compileClasspath + project(':minecraft-adapter').sourceSets.smoke.output
        runtimeClasspath += sourceSets.main.output + configurations.runtimeClasspath + project(':minecraft-adapter').sourceSets.smoke.output
    }
}
neoForge.mods.cinematic_chat.sourceSet sourceSets.smoke
neoForge.mods.cinematic_chat.sourceSet project(':minecraft-adapter').sourceSets.smoke
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = targetSpec.java }
jar {
    archiveFileName = "cinematic-chat-${project.version}+mc${targetSpec.minecraft}-neoforge.jar"
    from project(':minecraft-adapter').sourceSets.main.output
    from project(':client-common').sourceSets.main.output
    from project(':engine').sourceSets.main.output
    from project(':minecraft-api').sourceSets.main.output
    from rootProject.repoFile('LICENSE')
}
processResources { inputs.property 'version', project.version; filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version, minecraft: targetSpec.minecraft, neo: targetSpec.neoForge } }
apply from: rootProject.repoFile('build-logic/verify-jar.gradle')
tasks.named('runSmoke') {
    doFirst { delete file('run-smoke/smoke-report.json') }
    doLast {
        def report = file('run-smoke/smoke-report.json')
        if (!report.exists() || new groovy.json.JsonSlurper().parse(report).passed != true) {
            throw new GradleException("Client smoke scenario failed: ${report}")
        }
    }
}
