name: Build and client scenario matrix
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      smoke:
        type: boolean
        default: true
        description: Run the temporary-world client scenario
permissions:
  contents: read
jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: targets
        run: |
          python3 - <<'PY'
          import json, os
          targets=json.load(open('gradle/targets.json'))['targets']
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('matrix='+json.dumps({'include':targets},separators=(',',':'))+'\n')
          PY
  verify:
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - if: matrix.java == 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/wrapper-validation@v4
      - name: Verify the reviewed Wrapper and distribution pins
        run: python3 tools/verify-wrapper.py
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile, package and pure Java checks
        shell: bash
        run: |
          entry=legacy
          [[ '${{ matrix.java }}' == 25 ]] && entry=modern
          bash "$entry/gradlew" -p "$entry" '-PmcVersion=${{ matrix.minecraft }}' '-Ploader=${{ matrix.loader }}' --no-parallel ':${{ matrix.loader }}:build' check
      - name: Install headless graphics
        if: github.event_name != 'workflow_dispatch' || inputs.smoke
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libopenal1
      - name: Launch and temporary-world gameplay assertions
        if: github.event_name != 'workflow_dispatch' || inputs.smoke
        shell: bash
        run: |
          entry=legacy
          [[ '${{ matrix.java }}' == 25 ]] && entry=modern
          xvfb-run -a -s '-screen 0 2880x1600x24' bash "$entry/gradlew" -p "$entry" '-PmcVersion=${{ matrix.minecraft }}' '-Ploader=${{ matrix.loader }}' --no-parallel ':${{ matrix.loader }}:runSmoke'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mc${{ matrix.minecraft }}-${{ matrix.loader }}
          path: |
            targets/${{ matrix.minecraft }}/${{ matrix.loader }}/build/libs/*.jar
            targets/${{ matrix.minecraft }}/${{ matrix.loader }}/run-smoke/smoke-report.json
            targets/${{ matrix.minecraft }}/${{ matrix.loader }}/run-smoke/screenshots/*.png
            targets/${{ matrix.minecraft }}/${{ matrix.loader }}/run-smoke/logs/*.log
