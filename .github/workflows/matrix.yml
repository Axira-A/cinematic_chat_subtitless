name: Build and client scenario matrix
on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/validation/matrix.json'
      - 'docs/validation/core-tests.json'
      - 'docs/validation/ci-matrix.json'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/validation/matrix.json'
      - 'docs/validation/core-tests.json'
      - 'docs/validation/ci-matrix.json'
  workflow_dispatch:
    inputs:
      smoke:
        type: boolean
        default: true
        description: Run the temporary-world client scenario
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Wrapper, source selection and trust baseline consistency
        run: |
          python3 tools/verify/verify-wrapper.py
          python3 tools/verify/verify-source-layout.py
      - name: Pure Java contracts, engine and client models
        run: bash legacy/gradlew -p legacy -PcoreOnly check --no-parallel
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-reports
          path: |
            engine/build/reports/tests/
            engine/build/test-results/
            client-common/build/reports/tests/
            client-common/build/test-results/
            legacy/build/reports/
  targets:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: targets
        run: |
          python3 - <<'PY'
          import json, os
          targets=json.load(open('gradle/targets.json'))['targets']
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('matrix='+json.dumps({'include':targets},separators=(',',':'))+'\n')
          PY
  verify:
    needs: [core, targets]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      ALSOFT_DRIVERS: 'null'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - if: matrix.java == 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/wrapper-validation@v4
      - name: Verify the reviewed Wrapper and distribution pins
        run: python3 tools/verify/verify-wrapper.py
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile, package and pure Java checks
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          entry=legacy
          [[ '${{ matrix.java }}' == 25 ]] && entry=modern
          bash "$entry/gradlew" -p "$entry" '-PmcVersion=${{ matrix.minecraft }}' '-Ploader=${{ matrix.loader }}' --no-parallel ':${{ matrix.loader }}:build' ':${{ matrix.loader }}:smokeClasses' 2>&1 | tee ci-logs/build.log
          sha256sum 'targets/${{ matrix.minecraft }}/${{ matrix.loader }}/build/libs/${{ matrix.artifact }}' | tee ci-logs/jar-sha256.txt
      - name: Install headless graphics
        if: github.event_name != 'workflow_dispatch' || inputs.smoke
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libopenal1
      - name: Launch and temporary-world gameplay assertions
        if: github.event_name != 'workflow_dispatch' || inputs.smoke
        shell: bash
        run: |
          set -o pipefail
          entry=legacy
          [[ '${{ matrix.java }}' == 25 ]] && entry=modern
          xvfb-run -a -s '-screen 0 2880x1600x24' bash "$entry/gradlew" -p "$entry" '-PmcVersion=${{ matrix.minecraft }}' '-Ploader=${{ matrix.loader }}' --no-parallel ':${{ matrix.loader }}:runSmoke' 2>&1 | tee ci-logs/client.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mc${{ matrix.minecraft }}-${{ matrix.loader }}
          path: |
            ci-logs/
            legacy/build/reports/
            modern/build/reports/
            targets/${{ matrix.minecraft }}/minecraft/build/reports/
            targets/${{ matrix.minecraft }}/${{ matrix.loader }}/build/reports/
            targets/${{ matrix.minecraft }}/${{ matrix.loader }}/build/test-results/
            targets/${{ matrix.minecraft }}/${{ matrix.loader }}/build/libs/*.jar
            targets/${{ matrix.minecraft }}/${{ matrix.loader }}/run-smoke/smoke-report.json
            targets/${{ matrix.minecraft }}/${{ matrix.loader }}/run-smoke/screenshots/*.png
            targets/${{ matrix.minecraft }}/${{ matrix.loader }}/run-smoke/logs/*.log
